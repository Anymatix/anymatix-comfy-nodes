# The Comfy registry manifest for this pack. `comfy node publish` reads it from
# this directory and nowhere else.
#
# EVERY FIELD IS ONE THE PARSER READS, and the parser was read, not remembered:
# comfy-cli's `comfy_cli/registry/types.py` and `config_parser.py`, whose shape
# ComfyUI's own `comfy_config/types.py` is required to mirror. Re-read against
# comfy-cli 1.20.0 on 2026-09-09.
#
# `name` IS the registry id and it is permanent — a rename is a new node, not
# an edit. It is also what every Anymatix export writes into its `requires`
# line and into `aux_id`, so changing it would make the exports disagree with
# the registry.
#
# `PublisherId` must name a publisher that EXISTS: `anymatix` was claimed on
# 2026-09-07 and `https://api.comfy.org/publishers/anymatix` answers 200.
#
# `dependencies` is this pack's own requirements.txt with the prose stripped —
# nine packages, compared line by line at this commit. The registry installs
# from THIS list, not from requirements.txt.
#
# `license = { file = "LICENSE" }` resolves: LICENSE is present here and is
# GPL-3.0.
#
# `Icon` must be a URL, not a path — the publish payload sends the string
# through unchanged. It points at `icon.png` in this repository, which is the
# Anymatix application icon (`app/resources/icon.icns`) at 512x512.
#
# THREE REGISTRY FIELDS CANNOT BE SET FROM THIS FILE, and are not omissions:
# `author` and `tags` are node fields the publish payload never carries (see
# `registry/api.py:publish_node_version`), so they are set with
# `PUT /publishers/anymatix/nodes/anymatix-comfy-nodes`. `category` is marked
# `deprecated` in the registry's own OpenAPI — "Use 'tags' field instead. This
# field will be removed in a future version" — so it is deliberately left
# empty.

[project]
name = "anymatix-comfy-nodes"
description = "The nodes Anymatix runs on: URL-addressed model loaders that download what a workflow asks for, plus CLIPSeg, masking, SAM2 coordinates and the save nodes Anymatix reads its results from."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.4.7",
    "numpy>=1.19.0",
    "av>=16.0.1",
    "scikit-image",
    "opencv-python>=4.5.0",
    "Pillow>=8.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=0.8.0",
    "shapely",
]

[project.urls]
Repository = "https://github.com/Anymatix/anymatix-comfy-nodes"
Homepage = "https://www.anymatix.com"

[tool.comfy]
PublisherId = "anymatix"
DisplayName = "Anymatix"
Icon = "https://raw.githubusercontent.com/Anymatix/anymatix-comfy-nodes/main/icon.png"
includes = []
