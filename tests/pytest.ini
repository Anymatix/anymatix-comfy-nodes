# This file exists to keep pytest's rootdir HERE, and it is not cosmetic:
# without it the whole suite errors before a single test runs.
#
# pytest builds its collection tree from the rootdir down, and rootdir was the
# repository root because that is where `pyproject.toml` lives. The repository
# root also holds `__init__.py` — the ComfyUI node-pack entry point — so pytest
# treated the root as a package and imported it, and `from .expunge import *`
# raised `attempted relative import with no known parent package` at the setup
# of every test. Measured with pytest 9.1.1 in the app's own venv on
# 2026-09-09: 15 errors, 0 tests run.
#
# An empty ini inside `tests/` makes `tests/` the rootdir for any invocation
# whose arguments are inside it, so the node pack is never imported as a
# package. Run: `python -m pytest tests/ -q` from the repository root.
[pytest]
